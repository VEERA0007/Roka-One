name: Build GenSolar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.txt'

concurrency:
  group: gensolar-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    env:
      PROJECT_DIR: gensolar-android-project/gensolar-android

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          test -f app/src/main/assets/index.html
          echo "Android project files found."

      - name: Prepare ephemeral debug signing key
        working-directory: ${{ env.PROJECT_DIR }}/app
        run: |
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.GENSOLAR_DEBUG_KEYSTORE_BASE64 }}

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace

      - name: Name the APK
        run: |
          VERSION=$(grep -o "versionName '[^']*'" ${{ env.PROJECT_DIR }}/app/build.gradle | cut -d"'" -f2)
          cp ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk "GenSolar-Pro-v${VERSION}.apk"
          echo "APK_FILE=GenSolar-Pro-v${VERSION}.apk" >> "$GITHUB_ENV"
          echo "APK_VERSION=${VERSION}" >> "$GITHUB_ENV"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GenSolar-Pro-debug-APK
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest "${APK_FILE}" \
            --title "GenSolar Pro v${APK_VERSION} (latest build)" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. Download the .apk file below on your phone and open it to install." \
            --target "${GITHUB_SHA}"
