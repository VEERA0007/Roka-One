name: GenSolar WebView UI Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - "gensolar-android-project/gensolar-android/app/src/main/assets/**"
      - "tests/gensolar-webview-smoke.mjs"
      - "tests/epc-analysis-smoke.mjs"
      - "tests/epc-thin-test.js"
      - "tests/epc-bom-test.js"
      - "tests/epc-pdelta-test.js"
      - "tests/epc-wind-long-test.js"
      - "tests/epc-staad-test.js"
      - "tests/epc-auto-test.js"
      - "tests/epc-auto-smoke.mjs"
      - "tests/epc-sheet-test.js"
      - "tests/epc-struct3d-test.js"
      - "tests/epc-shading-test.js"
      - "tests/epc-sheet-smoke.mjs"
      - "tests/epc-survey-test.js"
      - "tests/epc-survey-smoke.mjs"
      - ".github/workflows/android-ui-smoke.yml"
  pull_request:
    paths:
      - "gensolar-android-project/gensolar-android/app/src/main/assets/**"
      - "tests/gensolar-webview-smoke.mjs"
      - "tests/epc-analysis-smoke.mjs"
      - "tests/epc-thin-test.js"
      - "tests/epc-bom-test.js"
      - "tests/epc-pdelta-test.js"
      - "tests/epc-wind-long-test.js"
      - "tests/epc-staad-test.js"
      - "tests/epc-auto-test.js"
      - "tests/epc-auto-smoke.mjs"
      - "tests/epc-sheet-test.js"
      - "tests/epc-struct3d-test.js"
      - "tests/epc-shading-test.js"
      - "tests/epc-sheet-smoke.mjs"
      - "tests/epc-survey-test.js"
      - "tests/epc-survey-smoke.mjs"
      - ".github/workflows/android-ui-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run GenSolar mobile WebView page smoke tests
        run: |
          node tests/gensolar-webview-smoke.mjs
          node tests/epc-analysis-smoke.mjs
          node tests/epc-fem-test.js
          node tests/epc-thin-test.js
          node tests/epc-bom-test.js
          node tests/epc-pdelta-test.js
          node tests/epc-wind-long-test.js
          node tests/epc-staad-test.js
          node tests/epc-auto-test.js
          node tests/epc-auto-smoke.mjs
          node tests/epc-sheet-test.js
          node tests/epc-struct3d-test.js
          node tests/epc-shading-test.js
          node tests/epc-sheet-smoke.mjs
          node tests/epc-survey-test.js
          node tests/epc-survey-smoke.mjs
